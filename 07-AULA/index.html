<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> TRABALHANDO COM INPUTS </h1>
    </header>
    
    <!-- INPUTS -->
    <main>
        <h2>Formulário de cadarastro </h2>

        <!-- input - coleta informaçõe do usuário  -->
        <!-- form - englobar os campos do formulário -->
        <!-- action - pra onde vão as infomrações preenchidas -->
        <!-- method - forma de como vão as informações -  -->
        <form action="" method="">

            <!-- label - texto de apoio pra guiar o input -->
            <!-- forma 1 - label sem input -->
            <label for="nomeCompleto"> Nome Completo: </label>
            <!-- text - caracteres em geral -->
            <!-- name - usado para indetificar o input quando enviar os dados -->
            <!-- id - identificação daquele elemento html -->
            <input type="text" name="nomeCompleto" id="nomeCompleto">

            <br> <br>

            <!-- forma 2 - input dentro label -->
            <label>
                Senha:
                <!-- password - senhas  -->
                <input type="password" name="senha" id="senha">
            </label>
        </form>
    </main>

    <footer>
        <p> DIREITOS SÃO MEUS, EU QUE FIZ TUDO </p>
    </footer>
</body>
</html>
